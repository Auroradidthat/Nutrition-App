<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutrition App</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/script.js"></script>
</head>
<body>
    <header>
        <nav>
            <a href="about.html">About This Project</a>
        </nav>
    </header>

    <main>
        <section>
            <div class="heading-style">
                <h1>Nutrition App</h1>
                <p>
                    This application allows the user to add and remove foods within their list. Future
                    features will include recipes that can be added to the list, as well as nutrition tracking.
                </p>
            </div>
        </section>

        <!--ADD ITEMS AND QUANTITY TO LIST-->
        <section>
            <div class="list-wrap">
                <!--ADD ITEMS AND QUANTITY TO LIST-->
                <form id="add-form" class="module-items">
                    <div class="item-group">
                        <label for="item-input">
                            <strong>Add Food Item:</strong>
                        </label>
                        <input type="text" id="item-input" placeholder="e.g. Milk" autocomplete="off">
                    </div>
                    <div class ="qty-group">
                        <label for="quantity-input"><strong>Quantity:</strong></label>
                        <input type="number" id="quantity-input" value="1" inputmode="numeric" min="1" max="99">
                    </div>
                    <div>
                        <button type="submit" id="add-btn"><strong>Add to list</strong></button>
                    </div>
                </form>

                <!--LIST ITEMS AND ERROR MESSAGES-->
                <div>
                    <p id="status" role="status"></p>
                    <ul id="item-list"></ul>
                </div>          
            </div>
        </section>
    </main>
</body>
</html>
