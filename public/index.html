<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutrition App</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/script.js"></script>
</head>
<body>
    <header>
        <nav>
            <a href="/demo">Demo</a>
        </nav>
    </header>

    <main>
        <section>
            <h1>Nutrition App</h1>
            <!--THE LIST IS RENDERED HERE BY script.js-->
            <ul id="item-list"></ul>
        </section>

        <section>
            <form id="add-form">
                <label for="item-input">Add Grocery Item:</label>
                <input type="text" id="item-input" placeholder="e.g. Milk" autocomplete="off">
                <label for="quantity-input">Item Quantity:</label>
                <input type="number" id="quantity-input" value="1" inputmode="numeric">
                <button type="submit" id="add-btn">Add to list</button>
            </form>
        </section>

        <section>
            <!--ERRORS AND MESSAGES APPEAR HERE-->
            <p id="status" role="status"></p>
        </section>
    </main>
</body>
</html>
