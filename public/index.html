<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery List Web App</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/script.js"></script>
</head>
<body>
    <header>
        <nav>
            <a href="about.html">About This Project</a>
        </nav>
    </header>

    <main>
        <section>
            <div class="heading-style">
                <h1>Grocery List Web App</h1>
                <p>
                    This application allows the user to add and remove grocery items within their list. Future
                    features will include recipes that can be added to the list, as well as a budget feature.
                </p>
            </div>
        </section>

        <!--ADD ITEMS AND QUANTITY TO LIST-->
        <section>
            <div class = form-style>
                <form id="add-form">
                    <div class="form-fields">
                        <label for="item-input"><strong>Add Grocery Item:</strong></label>
                        <input type="text" id="item-input" placeholder="e.g. Milk" autocomplete="off">
                        <div class="qty-group">
                            <label for="quantity-input"><strong>Item Quantity:</strong></label>
                            <input type="number" id="quantity-input" value="1" inputmode="numeric" min="1" max="99">
                        </div>
                    </div>
                    <!--SUBMIT ITEMS AND AMOUNT FOR DISPLAY-->
                    <button type="submit" id="add-btn"><strong>Add to list</strong></button>
                </form>

                <!--LIST ITEMS AND ERROR MESSAGES-->
                <div>
                    <p id="status" role="status"></p>
                    <ul id="item-list"></ul>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
